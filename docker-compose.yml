version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: healthcare-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: healthcare
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - healthcare-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: healthcare-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - healthcare-network

volumes:
  mysql-data:

networks:
  healthcare-network:
