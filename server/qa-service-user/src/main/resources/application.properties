spring.application.name=qa-service-user
server.port=8080

# 跨域配置
# 说明：此处已不再配置 spring.web.cors.*。
# 原因是原配置中存在冲突 —— properties 写 allow-credentials=false，
# 而 config/CorsConfig.java 的 CorsConfigurationSource Bean 是 allowCredentials(true)，
# 且 Java Bean 优先生效，导致实际行为与配置文件不一致。
# 现已统一收敛到 CorsConfig.java，并把允许的来源收窄到前端开发服务器。

# Actuator 配置
# 启用所有端点
management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers
# 显示详细的健康信息
management.endpoint.health.show-details=always
# 启用健康检查组件
management.endpoint.health.show-components=always
# 自定义管理端点基础路径（可选）
management.endpoints.web.base-path=/actuator
# 启用 info 端点的贡献者
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# 应用信息配置
info.app.name=qa-service-user
info.app.description=QA Service User - Healthcare QA System User Management Service
info.app.version=0.0.1-SNAPSHOT
info.app.encoding=UTF-8
info.app.java.version=17
info.team=QA Healthcare Team
info.environment=development
info.build.timestamp=${BUILD_TIME:2025-11-03}
info.features=CORS,Actuator,Health Checks,User Management,Doctor Management,Patient Authentication

# ============ DataSource（需求2） ============
# 注意 characterEncoding 必须用 Java 字符集名 UTF-8，不能写 utf8mb4（那是 MySQL 服务端字符集名，
# JDBC 侧写 utf8mb4 会直接抛 Unsupported character encoding 'utf8mb4'）
spring.datasource.url=jdbc:mysql://localhost:3306/qa_live?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ MyBatis（需求2） ============
# XML 放在 resources/mapper/ 下，避免 Maven 默认不打包含 Java 目录 XML 的问题
mybatis.mapper-locations=classpath*:/mapper/**/*.xml
mybatis.type-aliases-package=com.leansofx.qaserviceuser.entity
# is_active -> isActive，前端字段映射依赖此项
mybatis.configuration.map-underscore-to-camel-case=true
# 开发期打印 SQL 便于调试（会把 SQL 参数打到控制台）。
# 交付前已关闭：如需排查 SQL，取消下一行注释即可。
# mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ============ JWT（需求3） ============
# HS256 要求密钥长度 >= 256bit(32字节)，请勿使用过短字符串，否则启动抛 WeakKeyException
jwt.secret=qa-live-healthcare-interview-demo-secret-key-please-replace-in-production
jwt.expiration-ms=86400000
