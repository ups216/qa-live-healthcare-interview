spring.application.name=qa-service-user
server.port=8080

# 数据库：与 docker-compose 中 MySQL 一致，库名 qa_healthcare，用户 qa_user；字符集 UTF-8，防止中文乱码
spring.datasource.url=jdbc:mysql://localhost:3306/qa_healthcare?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=qa_user
spring.datasource.password=qa_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 连接池（Spring Boot 默认 HikariCP），防止连接泄漏
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA：表名为小写 doctor（实体 @Table(name="doctor")），仅更新表结构不删表
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# 启动时执行 data.sql 插入初始医生数据（INSERT IGNORE 避免重复插入）
# 延后执行：等 Hibernate 建表后再执行 data.sql，避免表不存在报错
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# HTTP 响应 UTF-8（与 Utf8EncodingConfig 配合，避免 API 中文乱码）
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 跨域配置
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false
spring.web.cors.max-age=3600

# Actuator 配置
# 启用所有端点
management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers
# 显示详细的健康信息
management.endpoint.health.show-details=always
# 启用健康检查组件
management.endpoint.health.show-components=always
# 自定义管理端点基础路径（可选）
management.endpoints.web.base-path=/actuator
# 启用 info 端点的贡献者
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# 应用信息配置
info.app.name=qa-service-user
info.app.description=QA Service User - Healthcare QA System User Management Service
info.app.version=0.0.1-SNAPSHOT
info.app.encoding=UTF-8
info.app.java.version=17
info.team=QA Healthcare Team
info.environment=development
info.build.timestamp=${BUILD_TIME:2025-11-03}
info.features=CORS,Actuator,Health Checks,User Management
