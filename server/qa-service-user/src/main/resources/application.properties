spring.application.name=qa-service-user
server.port=8080

# MySQL datasource (can be overridden by env vars)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/qa_healthcare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci}
spring.datasource.username=${DB_USERNAME:qa_user}
spring.datasource.password=${DB_PASSWORD:qa_pass_123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 跨域配置
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false
spring.web.cors.max-age=3600

# Actuator 配置
# 启用所有端点
management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers
# 显示详细的健康信息
management.endpoint.health.show-details=always
# 启用健康检查组件
management.endpoint.health.show-components=always
# 自定义管理端点基础路径（可选）
management.endpoints.web.base-path=/actuator
# 启用 info 端点的贡献者
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# 应用信息配置
info.app.name=qa-service-user
info.app.description=QA Service User - Healthcare QA System User Management Service
info.app.version=0.0.1-SNAPSHOT
info.app.encoding=UTF-8
info.app.java.version=17
info.team=QA Healthcare Team
info.environment=development
info.build.timestamp=${BUILD_TIME:2025-11-03}
info.features=CORS,Actuator,Health Checks,User Management

# JWT (HS256; secret must be >= 32 bytes in UTF-8)
qa.jwt.secret=${JWT_SECRET:qa-demo-jwt-secret-key-must-be-at-least-32-bytes-long-for-hs256}
qa.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
