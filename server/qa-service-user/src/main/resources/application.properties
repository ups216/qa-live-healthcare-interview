# =============================================================
# qa-service-user — Application Configuration
# =============================================================

# ── 应用基本信息 ───────────────────────────────────────────────
spring.application.name=qa-service-user

# ── 服务器 ────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ── 数据源 ────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/qa_medical?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 连接池
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ── Jackson JSON ──────────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# ── 跨域配置 ──────────────────────────────────────────────────
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false
spring.web.cors.max-age=3600

# ── MyBatis ───────────────────────────────────────────────────
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.leansofx.qaserviceuser.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ── 日志 ──────────────────────────────────────────────────────
logging.level.com.qa.medical=DEBUG
logging.level.org.springframework.web=INFO

# ── Spring Boot Actuator ──────────────────────────────────────
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# ── 应用信息（/actuator/info）────────────────────────────────
info.app.name=qa-service-user
info.app.description=QA Service User - Healthcare QA System User Management Service
info.app.version=0.0.1-SNAPSHOT
info.app.encoding=UTF-8
info.app.java.version=17
info.team=QA Healthcare Team
info.environment=development
info.build.timestamp=${BUILD_TIME:2025-11-03}
info.features=CORS,Actuator,Health Checks,User Management
