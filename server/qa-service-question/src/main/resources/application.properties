spring.application.name=qa-service-question
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/qa_healthcare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.banner=false

logging.level.com.leansofx.qaservicequestion.mapper=debug
logging.level.com.baomidou.mybatisplus=debug
logging.level.org.apache.ibatis=debug
